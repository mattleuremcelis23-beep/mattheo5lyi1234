<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title></title>
        <style>
            :root {
                background: #000000;
            }

            body {
                background: #000000;
                margin: 0;
                overflow: hidden;
                width: 100vw;
                height: 100vh;
            }

            video {
                position: fixed;
                inset: 0;
                display: block;
                width: 100%;
                height: 100%;
                object-fit: cover;
                background: #000000;
            }

            body::after {
                content: "";
                position: fixed;
                inset: 0;
                pointer-events: none;
                background: radial-gradient(ellipse at center, transparent 45%, rgba(0, 0, 0, 0.7) 100%);
            }

            #video-error {
                position: fixed;
                inset: 50% 20px auto;
                color: #ffffff;
                text-align: center;
                font-family: Arial, sans-serif;
            }
        </style>
    </head>
    <body>
        <video id="scare-video" autoplay playsinline onerror="document.getElementById('video-error').hidden = false">
            <source src="Voicy_foxy jumpscare fnaf2.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>
        <p id="video-error" hidden>Video file not found. Put "Voicy_foxy jumpscare fnaf2.mp4" in this project folder.</p>
        <script>
            const scareVideo = document.getElementById("scare-video");

            function startWithSound() {
                scareVideo.muted = false;
                scareVideo.volume = 1;
                scareVideo.play();
            }

            document.addEventListener("pointerdown", startWithSound, { once: true });
            document.addEventListener("keydown", startWithSound, { once: true });
        </script>
    </body>
</html>
